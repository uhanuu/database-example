spring:
  application:
    name: example

  datasource:
    source:
      jdbc-url: jdbc:mysql://localhost:3306/regram?allowPublicKeyRetrieval=true&useSSL=false
      username: root
      password: 1234
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        initialization-fail-timeout: -1
    replica1:
      jdbc-url: jdbc:mysql://localhost:3307/regram?allowPublicKeyRetrieval=true&useSSL=false
      username: root
      password: 1234
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        initialization-fail-timeout: -1
    replica2:
      jdbc-url: jdbc:mysql://localhost:3308/regram?allowPublicKeyRetrieval=true&useSSL=false
      username: root
      password: 1234
      driver-class-name: com.mysql.cj.jdbc.Driver
      hikari:
        initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        temp:
          use_jdbc_metadata_defaults: false
    defer-datasource-initialization: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.datasource: DEBUG
    com.example.example: DEBUG